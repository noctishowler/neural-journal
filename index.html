<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <meta name="mrbd-web-app-capable" content="yes">
  <meta name="theme-color" content="#030305">
  <meta name="application-name" content="Neural Journal">

  <meta
    name="description"
    content="A journal for Meta Display with neural-band handwriting, swipe unlock, and date-searchable entries."
  >

  <title>Neural Journal</title>

  <link
    rel="icon"
    type="image/png"
    sizes="96x96"
    href="assets/neural-journal/icons/launch-96.PNG"
  >

  <link
    rel="icon"
    type="image/png"
    sizes="192x192"
    href="assets/neural-journal/icons/launch-192.PNG"
  >

  <link
    rel="apple-touch-icon"
    href="assets/neural-journal/icons/launch-192.PNG"
  >

  <link
    rel="stylesheet"
    href="assets/neural-journal/theme.css"
  >

  <link rel="stylesheet" href="styles.css?v=3">

  <script src="app.js" defer></script>
</head>

<body class="nj-theme">
  <main id="app" aria-label="Neural Journal">
    <header class="app-header">
      <span class="brand">NEURAL JOURNAL</span>
      <span id="date"></span>
    </header>

    <section id="screen"></section>

    <footer id="hint"></footer>

    <p
      id="status"
      role="status"
      aria-live="polite"
      aria-atomic="true"
    ></p>
  </main>
</body>
</html>

<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=600, height=600, initial-scale=1.0, user-scalable=no"
  >

  <meta
    name="description"
    content="A journal for Meta Display with neural-band handwriting, swipe unlock, and calendar-based entry browsing."
  >

  <meta
    name="mrbd-web-app-capable"
    content="yes"
  >

  <meta
    name="theme-color"
    content="#030305"
  >

  <meta
    name="application-name"
    content="Neural Journal"
  >

  <title>Neural Journal</title>

  <!-- Meta Display / browser launcher icon -->
  <link
    rel="icon"
    type="image/png"
    href="favicon.PNG"
  >

  <!-- Web app manifest -->
  <link
    rel="manifest"
    href="manifest.webmanifest"
  >

  <!-- Neural Journal theme -->
  <link
    rel="stylesheet"
    href="assets/neural-journal/theme.css"
  >

  <link
    rel="stylesheet"
    href="styles.css?v=4"
  >

  <script
    src="app.js"
    defer
  ></script>
</head>

<body class="nj-theme">

  <main
    id="app"
    aria-label="Neural Journal"
  >

    <header class="app-header">
      <span class="brand">
        NEURAL JOURNAL
      </span>

      <span id="date"></span>
    </header>

    <section id="screen"></section>

    <footer id="hint"></footer>

    <p
      id="status"
      role="status"
      aria-live="polite"
      aria-atomic="true"
    ></p>

  </main>

</body>

</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >
  <meta name="mrbd-web-app-capable" content="yes">
  <meta
    name="description"
    content="A journal for Meta Display with neural-band handwriting, swipe unlock, and date-searchable entries."
  >

  <title>Neural Journal</title>

  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>

<body>
  <main id="app" aria-label="Neural Journal">
    <header>
      <span class="brand">NEURAL JOURNAL</span>
      <span id="date"></span>
    </header>

    <section id="screen"></section>

    <footer id="hint"></footer>

    <p
      id="status"
      role="status"
      aria-live="polite"
    ></p>
  </main>
</body>
</html>
